---
- name: Restart NUT Server
  become: true
  ansible.builtin.systemd:
    name: nut-server
    state: restarted
    enabled: true
  listen: "restart nut"
  when: nut_mode | default('netserver') in ['netserver', 'standalone']

- name: Stop UPS Driver
  become: true
  ansible.builtin.command:
    cmd: upsdrvctl stop
  failed_when: false
  changed_when: true
  listen: "restart nut"
  when: nut_mode | default('netserver') in ['netserver', 'standalone']

- name: Start UPS Driver
  become: true
  ansible.builtin.command:
    cmd: upsdrvctl start
  changed_when: true
  listen: "restart nut"
  when: nut_mode | default('netserver') in ['netserver', 'standalone']

- name: Restart NUT Client
  become: true
  ansible.builtin.systemd:
    name: nut-client
    state: restarted
    enabled: true
  listen: "restart nut"
  when: nut_mode | default('netserver') != 'none'

- name: Reload udev
  become: true
  ansible.builtin.systemd:
    name: systemd-udevd
    state: reloaded
