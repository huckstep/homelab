---
- name: Prepare container storage
  become: true
  vars:
    nfs_export_options: "rw,sync,no_subtree_check,no_root_squash,anonuid=0,anongid=0"
  block:
    - name: Install parted
      ansible.builtin.apt:
        name: parted
        state: present
        update_cache: true

    - name: Create container storage base directory
      ansible.builtin.file:
        path: /container_storage
        state: directory
        mode: '0755'

    - name: Determine partition device name
      ansible.builtin.set_fact:
        partition_device: "{{ (secondary_device + 'p1') if (secondary_device.startswith('/dev/nvme') or secondary_device.startswith('/dev/mmcblk')) else (secondary_device + '1') }}"

    - name: Check partition filesystem type
      ansible.builtin.command: "blkid -o value -s TYPE {{ partition_device }}"
      register: fs_check
      failed_when: false
      changed_when: false

    - name: Remove existing partition if not ext4
      community.general.parted:
        device: "{{ secondary_device }}"
        number: 1
        state: absent
      when: fs_check.rc == 0 and fs_check.stdout != "ext4"

    - name: Create partition on device
      community.general.parted:
        device: "{{ secondary_device }}"
        number: 1
        state: present
        part_end: "100%"
        part_start: "0%"
        fs_type: ext4
      when: fs_check.rc != 0 or fs_check.stdout != "ext4"

    - name: Create ext4 filesystem
      community.general.filesystem:
        fstype: ext4
        dev: "{{ partition_device }}"
        force: true
      when: fs_check.rc != 0 or fs_check.stdout != "ext4"

    - name: Create fast storage subdirectory
      ansible.builtin.file:
        path: /container_storage/fast
        state: directory
        mode: '0755'

    - name: Mount NVMe drive to fast storage
      ansible.posix.mount:
        path: /container_storage/fast
        src: "{{ partition_device }}"
        fstype: ext4
        state: mounted
        opts: defaults
        dump: 0
        passno: 2

    - name: Create slow storage subdirectory
      ansible.builtin.file:
        path: /container_storage/slow
        state: directory
        mode: '0755'

    - name: Check if NAS directory already exists
      ansible.builtin.stat:
        path: /container_storage/nas
      register: nas_dir_stat

    - name: Create NAS storage subdirectory
      ansible.builtin.file:
        path: /container_storage/nas
        state: directory
        mode: '0755'
      when: not nas_dir_stat.stat.exists

    - name: Install NFS server
      ansible.builtin.apt:
        name:
          - nfs-kernel-server
          - nfs-common
        state: present
        update_cache: true

    - name: Check if /container_storage/nas is a mountpoint
      ansible.builtin.command: mountpoint -q /container_storage/nas
      register: nas_is_mountpoint
      failed_when: false
      changed_when: false

    - name: Run stat on /container_storage/nas if it is a mountpoint
      ansible.builtin.command: stat /container_storage/nas
      register: nas_stat_output
      failed_when: false
      changed_when: false
      when: nas_is_mountpoint.rc == 0

    - name: Check for "Stale file handle" in stat output
      ansible.builtin.set_fact:
        nas_stale_mount: "{{ (nas_stat_output.stdout is search('Stale file handle')) or (nas_stat_output.stderr is search('Stale file handle')) }}"
      when: 
        - nas_is_mountpoint.rc == 0
        - nas_stat_output is defined

    - name: Force unmount stale NFS mount
      ansible.builtin.command: umount -f -l /container_storage/nas
      when: nas_stale_mount | default(false)
      failed_when: false
      changed_when: true

    # NFS Mount Options Explained:
    # - _netdev: Wait for network to be available before mounting
    # - nofail: Don't fail boot if mount fails
    # - x-systemd.automount: Mount on-demand when accessed
    # - x-systemd.requires=network-online.target: Ensure network is online before mount
    # - soft: Return error if NFS server is unreachable (WARNING: can lead to data loss if server becomes unavailable during write operations)
    # - timeo=30: Timeout of 30 deciseconds (3 seconds) for RPC requests
    # - retrans=3: Retry failed RPC requests 3 times before returning error
    # - rsize=8192: Read buffer size of 8KB (balances performance vs memory usage for typical NAS workloads)
    # - wsize=8192: Write buffer size of 8KB (balances performance vs memory usage for typical NAS workloads)
    # - vers=4.1: Use NFSv4.1 for better performance and security features
    - name: Mount NAS NFS share to container storage
      ansible.posix.mount:
        path: /container_storage/nas
        src: "{{ secrets.nas_host }}:{{ secrets.nas_nfs_export }}"
        fstype: nfs
        state: mounted
        opts: _netdev,nofail,x-systemd.automount,x-systemd.requires=network-online.target,soft,timeo=30,retrans=3,rsize=8192,wsize=8192,vers=4.1
        dump: 0
        passno: 0

    - name: Wait for NFS mount to settle
      ansible.builtin.pause:
        seconds: 2

    - name: Set proper ownership for container storage base
      ansible.builtin.file:
        path: /container_storage
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Set proper permissions on local storage paths (not NFS)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0777'
        recurse: false
      loop:
        - /container_storage/fast
        - /container_storage/slow

    - name: Ensure NAS mount is accessible and set permissions
      ansible.builtin.file:
        path: /container_storage/nas
        state: directory
        owner: root
        group: root
        mode: '0777'
        recurse: false

    - name: Verify NAS mount permissions
      ansible.builtin.stat:
        path: /container_storage/nas
      register: nas_perms

    - name: Display NAS mount permissions
      ansible.builtin.debug:
        msg: "NAS mount permissions: {{ nas_perms.stat.mode }}"

    - name: Remove existing NFS exports for secondary storage
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: '^/mnt/secondary-storage.*'
        state: absent

    - name: Remove existing NFS exports for container storage
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: '^/container_storage.*'
        state: absent

    - name: Configure Server NFS export for container storage
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "/container_storage {{ secrets.server_network }}({{ nfs_export_options }})"
        state: present
    - name: Configure LAN NFS export for container storage
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "/container_storage {{ secrets.lan_network }}({{ nfs_export_options }})"
        state: present

    - name: Export NFS filesystem
      ansible.builtin.command: exportfs -ra
      changed_when: true

    - name: Enable and start NFS server
      ansible.builtin.service:
        name: nfs-kernel-server
        state: started
        enabled: true
