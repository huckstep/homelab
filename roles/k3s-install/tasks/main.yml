---
- name: Uninstall K3s if force_uninstall is true
  when: k3s_force_uninstall | bool
  become: true
  block:
    - name: Stop K3s service
      ansible.builtin.service:
        name: k3s
        state: stopped
      failed_when: false

    - name: Uninstall K3s
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      failed_when: false
      changed_when: true

    - name: Remove K3s data directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s
        state: absent
      failed_when: false

- name: Install K3s single server
  become: true
  block:
    - name: Download K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'

    - name: Install K3s
      ansible.builtin.command: /tmp/k3s-install.sh {{ k3s_server_args }}
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      changed_when: true

    - name: Wait for K3s to be ready
      ansible.builtin.command: kubectl get nodes
      register: k3s_status
      until: k3s_status.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for kubeconfig to be created
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 30
      when: k3s_status.rc == 0

    - name: Wait for Traefik to be ready
      ansible.builtin.pause:
        seconds: 15

    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: '0755'

    - name: Install Helm
      ansible.builtin.command: /tmp/get-helm-3.sh
      args:
        creates: /usr/local/bin/helm
      changed_when: false

    - name: Create .kube directory for ansible_user
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy kubeconfig to ansible_user
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ ansible_user_dir }}/.kube/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
        remote_src: true

    - name: Fetch kubeconfig for local merging
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /tmp/{{ inventory_hostname }}-kubeconfig
        flat: true

    - name: Check if kubeconfig was fetched successfully
      ansible.builtin.stat:
        path: /tmp/{{ inventory_hostname }}-kubeconfig
      register: kubeconfig_stat
      delegate_to: localhost
      become: false

    - name: Update server URL in kubeconfig
      ansible.builtin.replace:
        path: /tmp/{{ inventory_hostname }}-kubeconfig
        regexp: 'server: https://.*:6443'
        replace: 'server: https://{{ ansible_default_ipv4.address }}:6443'
      delegate_to: localhost
      become: false
      when: kubeconfig_stat.stat.exists

    - name: Remove certificate-authority-data and add insecure-skip-tls-verify
      ansible.builtin.shell: |
        # Remove only certificate-authority-data line (keep client-certificate-data and client-key-data)
        grep -v '^\s*certificate-authority-data:' /tmp/{{ inventory_hostname }}-kubeconfig > /tmp/{{ inventory_hostname }}-kubeconfig.tmp

        # Add insecure-skip-tls-verify after the server line
        awk '/server: https:\/\/.*:6443/ {print; print "    insecure-skip-tls-verify: true"; next} {print}' \
          /tmp/{{ inventory_hostname }}-kubeconfig.tmp > /tmp/{{ inventory_hostname }}-kubeconfig

        # Clean up temp file
        rm /tmp/{{ inventory_hostname }}-kubeconfig.tmp
      delegate_to: localhost
      become: false
      changed_when: true
      when: kubeconfig_stat.stat.exists

    - name: Ensure local .kube directory exists
      ansible.builtin.file:
        path: ~/.kube
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false

    - name: Merge kubeconfig with local config
      ansible.builtin.shell: |
        # Copy the updated kubeconfig to local location
        cp /tmp/{{ inventory_hostname }}-kubeconfig ~/.kube/config

        # Set current context to default (K3s context)
        kubectl config use-context default
      delegate_to: localhost
      become: false
      changed_when: true
      when: kubeconfig_stat.stat.exists

- name: Configure storage provisioners
  become: true
  block:
    - name: Remove original default storage class
      ansible.builtin.command: kubectl delete storageclass local-path
      changed_when: true
      failed_when: false

    - name: Create fast storage class
      ansible.builtin.copy:
        content: "{{ lookup('template', 'fast-storage-class.yaml.j2') }}"
        dest: /tmp/fast-storage-class.yaml
        mode: '0644'
      changed_when: true

    - name: Apply fast storage class
      ansible.builtin.command: kubectl apply -f /tmp/fast-storage-class.yaml
      changed_when: true

    - name: Create slow storage class
      ansible.builtin.copy:
        content: "{{ lookup('template', 'slow-storage-class.yaml.j2') }}"
        dest: /tmp/slow-storage-class.yaml
        mode: '0644'
      changed_when: true

    - name: Apply slow storage class
      ansible.builtin.command: kubectl apply -f /tmp/slow-storage-class.yaml
      changed_when: true

- name: Install external-dns
  become: true
  block:
    - name: Create external-dns namespace
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create namespace external-dns --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Create Cloudflare API token secret
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create secret generic cloudflare-api-token \
          --from-literal=cloudflare_api_token={{ secrets.cloudflare.token }} \
          --namespace external-dns \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Create external-dns manifest
      ansible.builtin.copy:
        content: "{{ lookup('template', 'external-dns.yaml.j2') }}"
        dest: /tmp/external-dns.yaml
        mode: '0644'

    - name: Apply external-dns manifest
      ansible.builtin.command: kubectl apply -f /tmp/external-dns.yaml
      changed_when: true

    - name: Set node external IP for servicelb
      ansible.builtin.command: >
        kubectl annotate node {{ ansible_hostname }}
        svccontroller.k3s.cattle.io/svcnodeport-pool={{ ansible_default_ipv4.address }}
        --overwrite
      changed_when: true

    - name: Label node to enable servicelb
      ansible.builtin.command: >
        kubectl label node {{ ansible_hostname }}
        svccontroller.k3s.cattle.io/enablelb=true
        --overwrite
      changed_when: true

- name: Install cert-manager
  become: true
  block:
    - name: Apply cert-manager CRDs
      ansible.builtin.command: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.3/cert-manager.crds.yaml
      changed_when: true

    - name: Create cert-manager namespace
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Apply cert-manager deployment
      ansible.builtin.command: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.3/cert-manager.yaml
      changed_when: true

    - name: Configure cert-manager to use Cloudflare DNS resolvers
      ansible.builtin.shell: |
        set -o pipefail
        kubectl patch deployment cert-manager -n cert-manager --type=json -p='[
          {
            "op": "add",
            "path": "/spec/template/spec/containers/0/args/-",
            "value": "--dns01-recursive-nameservers=1.1.1.3:53,1.0.0.3:53"
          },
          {
            "op": "add",
            "path": "/spec/template/spec/containers/0/args/-",
            "value": "--dns01-recursive-nameservers-only"
          }
        ]'
      args:
        executable: /bin/bash
      changed_when: true

    - name: Wait for cert-manager webhook to be ready
      ansible.builtin.command: kubectl wait --for=condition=available --timeout=300s deployment/cert-manager-webhook -n cert-manager
      changed_when: false

    - name: Create Cloudflare API token secret for cert-manager
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create secret generic cloudflare-api-token-secret \
          --from-literal=api-token={{ secrets.cloudflare.token }} \
          --from-literal=zone-id={{ secrets.cloudflare.zone_id }} \
          --namespace cert-manager \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Create ClusterIssuer for Let's Encrypt staging
      ansible.builtin.copy:
        content: "{{ lookup('template', 'letsencrypt-staging-issuer.yaml.j2') }}"
        dest: /tmp/letsencrypt-staging-issuer.yaml
        mode: '0644'

    - name: Apply Let's Encrypt staging issuer
      ansible.builtin.command: kubectl apply -f /tmp/letsencrypt-staging-issuer.yaml
      changed_when: true

    - name: Create ClusterIssuer for Let's Encrypt production
      ansible.builtin.copy:
        content: "{{ lookup('template', 'letsencrypt-prod-issuer.yaml.j2') }}"
        dest: /tmp/letsencrypt-prod-issuer.yaml
        mode: '0644'

    - name: Apply Let's Encrypt production issuer
      ansible.builtin.command: kubectl apply -f /tmp/letsencrypt-prod-issuer.yaml
      changed_when: true

