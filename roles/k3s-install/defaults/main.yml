---
# K3s installation defaults
k3s_force_uninstall: false
k3s_version: "v1.33.4+k3s1"
k3s_server_args: "--cluster-init --tls-san {{ ansible_default_ipv4.address }} --write-kubeconfig-mode 644"

# External DNS configuration
external_dns_domain_filter: "{{ secrets.k3s.base_domain }}"  # Set to your domain or leave empty to watch all domains

# Let's Encrypt configuration Email for Let's Encrypt notifications
letsencrypt_email: "{{ secrets.email }}"  # Email for Let's Encrypt notifications
letsencrypt_staging: true  # Set to true to use staging environment for testing

# Storage configuration
# Fast storage uses NVMe drive mounted at /container_storage/fast
# Slow storage uses system disk at /container_storage/slow
# NAS storage uses NFS mount at /container_storage/nas
storage_class_fast: "local-path-nvme"
storage_class_slow: "local-path-ssd"
storage_class_nas: "local-path-nas"

# Portainer configuration
portainer_install: false  # Set to true to install Portainer Enterprise STS Agent
portainer_agent_version: "ee2-35"  # Portainer agent version
