---
- name: Security Setup
  hosts: servers
  gather_facts: false
  vars:
    ansible_python_interpreter: "/usr/bin/python3"
  roles:
    - security
    - pre-reqs


- name: Basic Setup
  hosts: servers
  gather_facts: true
  roles:
    - patch
    - starship
    # - nut
    # - tailscale
    # - docker
    - packer
    - terraform
