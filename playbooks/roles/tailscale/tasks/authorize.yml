- name: Get Tailnet Devices
  no_log: true
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/{{ secrets.tailscale.tailnet_id }}/devices"
    method: GET
    headers:
      Authorization: "Bearer {{ tailscale_access_token }}"
  register: tailscale_devices

- name: Debug device found
  ansible.builtin.debug:
    msg: "Found device: {{ item['hostname'] }}"
  when: item['hostname'] == inventory_hostname
  loop: "{{ tailscale_devices.json['devices'] }}"

- name: Set Tailscale Device ID
  ansible.builtin.set_fact:
    tailscale_device_id: "{{ item['nodeId'] }}"
  when: item['hostname'] == inventory_hostname
  loop: "{{ tailscale_devices.json['devices'] }}"

- name: Fail if device not found
  ansible.builtin.fail:
    msg: "Device {{ inventory_hostname }} not found in Tailscale network. Ensure the device is properly registered."
  when: tailscale_device_id is not defined

- name: Set Tailscale Routes
  no_log: true
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/device/{{ tailscale_device_id }}/routes"
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_access_token }}"
      Content-Type: "application/json"
    body_format: "json"
    body:
      routes: "{{ tailscale_routes.split(',') + ['0.0.0.0/0', '::/0'] }}"

- name: Disable Key Expiration
  no_log: true
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/device/{{ tailscale_device_id }}/key"
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_access_token }}"
      Content-Type: "application/json"
    body_format: "json"
    body:
      keyExpiryDisabled: true

- name: Update DNS rewrite in AdGuard Home
  ansible.builtin.include_tasks: dns.yml
  when: secrets.adguard is defined and secrets.adguard.api_url is defined
