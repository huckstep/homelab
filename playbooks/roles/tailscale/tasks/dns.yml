- name: Manage AdGuard Home DNS Rewrite
  block:
    - name: Get device Tailscale IP address
      ansible.builtin.set_fact:
        device_tailscale_ip: "{{ item['addresses'][0] }}"
      when: item['hostname'] == inventory_hostname
      loop: "{{ tailscale_devices.json['devices'] }}"

    - name: Fail if device IP not found
      ansible.builtin.fail:
        msg: "Could not determine Tailscale IP for device {{ inventory_hostname }}"
      when: device_tailscale_ip is not defined

    - name: Check if DNS rewrite already exists
      ansible.builtin.uri:
        url: "{{ secrets.adguard.api_url }}/rewrite/list"
        method: GET
        headers:
          Authorization: "Basic {{ (secrets.adguard.username + ':' + secrets.adguard.password) | b64encode }}"
        status_code: [200]
      register: existing_rewrites

    - name: Set hostname for DNS rewrite
      ansible.builtin.set_fact:
        dns_hostname: "{{ inventory_hostname }}.{{ secrets.adguard.domain_suffix | default('ts.local') }}"

    - name: Check if rewrite exists for this hostname
      ansible.builtin.set_fact:
        rewrite_exists: "{{ existing_rewrites.json | selectattr('domain', 'equalto', dns_hostname) | list | length > 0 }}"

    - name: Remove existing DNS rewrite if it exists
      ansible.builtin.uri:
        url: "{{ secrets.adguard.api_url }}/rewrite/delete"
        method: POST
        headers:
          Authorization: "Basic {{ (secrets.adguard.username + ':' + secrets.adguard.password) | b64encode }}"
          Content-Type: "application/json"
        body_format: json
        body:
          domain: "{{ dns_hostname }}"
        status_code: [200]
      when: rewrite_exists | bool

    - name: Add DNS rewrite to AdGuard Home
      ansible.builtin.uri:
        url: "{{ secrets.adguard.api_url }}/rewrite/add"
        method: POST
        headers:
          Authorization: "Basic {{ (secrets.adguard.username + ':' + secrets.adguard.password) | b64encode }}"
          Content-Type: "application/json"
        body_format: json
        body:
          domain: "{{ dns_hostname }}"
          answer: "{{ device_tailscale_ip }}"
        status_code: [200]
      register: dns_add_result

    - name: Debug DNS rewrite addition
      ansible.builtin.debug:
        msg: "Added DNS rewrite: {{ dns_hostname }} -> {{ device_tailscale_ip }}"
      when: ansible_verbosity >= 1
